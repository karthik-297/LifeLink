
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood | LifeLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2 class="logo">LifeLink</h2>
        <a href="index.html">Home</a>
    </nav>

    <section class="request-section">
        <div class="request-container">

            <h1>Request Blood</h1>
            <p>Submit a blood request for coordinator verification.</p>

            <form id="requestForm">

                <label>Reference Name</label>
                <input type="text" id="referenceName"
                    placeholder="Enter a fictional reference name" required>

                <label>Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select blood group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>

                <label>Units Requested</label>
                <input type="number" id="units"
                    min="1" step="1" required>

                <label>Hospital / Service Area</label>
                <input type="text" id="hospital"
                    placeholder="Enter demo hospital or area" required>

                <label>Required Date</label>
                <input type="date" id="requiredDate" required>

                <label>Contact Email</label>
                <input type="email" id="email"
                    placeholder="demo@example.com" required>

                <label>Additional Information</label>
                <textarea id="details"
                    placeholder="Enter optional demo information"></textarea>

                <div class="consent-row">
                    <input type="checkbox" id="consent" required>
                    <label for="consent">
                        I agree to submit this demo request for review.
                    </label>
                </div>

                <button type="submit" class="primary-btn">
                    Submit Blood Request
                </button>

            </form>

            <div id="requestMessage"></div>

        </div>
    </section>

    <script type="module" src="request-firestore.js"></script>
</body>
</html>
